name: healthy_hour
description: Healthy Hour — alternates between Working and Walking sessions and reminds you to drink water.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  bloc: ^8.1.4
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  go_router: ^14.6.0

  # Local design system. Kept as its own package so it carries no app
  # coupling and can be reused by companion apps or a storybook.
  healthy_hour_ui_kit:
    path: packages/healthy_hour_ui_kit
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.0.0
  path_provider: ^2.1.4
  rxdart: ^0.28.0
  uuid: ^4.5.1

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.6.0
  very_good_analysis: ^6.0.0

flutter:
  assets:
    - assets/brand/
  uses-material-design: true
